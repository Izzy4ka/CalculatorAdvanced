name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: 2. Настраиваем Java (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Даем права на выполнение Gradle
        run: chmod +x gradlew

      - name: 4. Запускаем Unit-тесты
        run: ./gradlew testDebugUnitTest

      - name: 5. Собираем Debug APK
        run: ./gradlew assembleDebug

      - name: 6. Сохраняем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk